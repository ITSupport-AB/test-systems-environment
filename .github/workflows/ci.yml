name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------
  # Headless verification suite (runs today - Perl ships on the runner)
  # ------------------------------------------------------------------
  perl-tests:
    name: Headless tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run headless leaderboard verification
        run: perl Assets/Tests/Editor/test_leaderboard_headless.pl

  # ------------------------------------------------------------------
  # Unity script compile check.
  #
  # Opens the project in a batchmode Unity editor so every .cs assembly
  # is compiled; Unity aborts with a non-zero exit code on "Scripts have
  # compiler errors", which fails this job (game-ci fails on non-zero exit).
  #
  # Prerequisites (each skips the compile cleanly, not as a failure):
  #   1. A Unity license secret named UNITY_LICENSE (generate one at
  #      https://game.ci/docs/github/activation/). Secrets cannot be
  #      referenced in `if:` conditionals, so HAS_UNITY_LICENSE below is
  #      derived at the job level and the guard step tests the env var.
  #   2. This folder must be a real Unity project: open it once in Unity
  #      Hub so ProjectSettings/ProjectVersion.txt and Packages/ are
  #      generated. The verify step below handles that case.
  # ------------------------------------------------------------------
  unity-compile:
    name: Unity compile check
    runs-on: ubuntu-latest
    env:
      HAS_UNITY_LICENSE: ${{ secrets.UNITY_LICENSE != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: License guard
        id: guard
        if: ${{ env.HAS_UNITY_LICENSE == 'false' }}
        run: |
          echo "::notice title=UNITY_LICENSE not configured::Add a UNITY_LICENSE secret (https://game.ci/docs/github/activation/) to enable the Unity compile check. Skipping it for now."
          echo "skip=true" >> "$GITHUB_OUTPUT"

      - name: Verify Unity project files
        id: verify-project
        if: ${{ steps.guard.outputs.skip != 'true' }}
        run: |
          if [ -f ProjectSettings/ProjectVersion.txt ]; then
            echo "has-project=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=No Unity project yet::ProjectSettings/ProjectVersion.txt is missing - open this folder in Unity Hub once to generate the project files, then the compile check will run."
            echo "has-project=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache Unity Library folder
        uses: actions/cache@v4
        if: ${{ steps.verify-project.outputs.has-project == 'true' }}
        with:
          path: Library
          key: Library-${{ runner.os }}-2022.3.22f1-${{ hashFiles('Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            Library-${{ runner.os }}-2022.3.22f1-

      - name: Compile scripts (batchmode editor)
        uses: game-ci/unity-builder@v4
        if: ${{ steps.verify-project.outputs.has-project == 'true' }}
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          # unityVersion 'auto' reads ProjectSettings/ProjectVersion.txt.
          # CompileCheck.Run (Assets/Editor/CompileCheck.cs) compiles all
          # assemblies; opening the project in batchmode already compiles
          # every script, and Unity aborts non-zero on compiler errors.
          unityVersion: auto
          targetPlatform: StandaloneWindows64
          buildMethod: CompileCheck.Run
          manualExit: 'true'
